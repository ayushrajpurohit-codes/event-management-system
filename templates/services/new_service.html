<!DOCTYPE html>
<html>
<head>
    <title>Add Service - Event Management System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #1f2937;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 240px;
            height: 100vh;
            background: #111827;
            color: white;
            padding: 25px 15px;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 22px;
        }

        .sidebar a {
            display: block;
            color: #d1d5db;
            text-decoration: none;
            padding: 13px 15px;
            margin-bottom: 6px;
            border-radius: 8px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: #2563eb;
            color: white;
        }

        .main {
            margin-left: 240px;
            min-height: 100vh;
        }

        .topbar {
            height: 70px;
            background: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            border-bottom: 1px solid #e5e7eb;
        }

        .topbar h3 {
            font-size: 21px;
        }

        .welcome {
            color: #6b7280;
        }

        .content {
            padding: 30px;
        }

        .page-header {
            margin-bottom: 25px;
        }

        .page-header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .page-header p {
            color: #6b7280;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            max-width: 850px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #374151;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        textarea:focus {
            border-color: #2563eb;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .required {
            color: #dc2626;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        .btn {
            border: none;
            padding: 12px 22px;
            border-radius: 7px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #374151;
        }

        .btn-secondary:hover {
            background: #d1d5db;
        }
    </style>
</head>

<body>

<div class="sidebar">

    <h2>Event Manager</h2>

    <a href="{% url 'dashboard' %}">Dashboard</a>
    <a href="{% url 'booking_list' %}">Bookings</a>
    <a href="{% url 'event_list' %}">Events</a>
    <a href="{% url 'event_type_list' %}">Event Types</a>
    <a href="{% url 'service_list' %}" class="active">Services</a>

    <a href="#">Reports</a>
    <a href="#">Users</a>
    <a href="#">Settings</a>

    <a href="{% url 'logout' %}">Logout</a>

</div>

<div class="main">

    <div class="topbar">
        <h3>Add Service</h3>

        <div class="welcome">
            Welcome, {{ request.user.username }}
        </div>
    </div>

    <div class="content">

        <div class="page-header">
            <h1>Add New Service</h1>
            <p>Create a service that can be added to event bookings.</p>
        </div>

        <div class="card">

            <form method="POST">

                {% csrf_token %}

                <div class="form-group">
                    <label>
                        Service Name <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        name="name"
                        placeholder="Enter service name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Description</label>

                    <textarea
                        name="description"
                        placeholder="Enter service description"
                    ></textarea>
                </div>

                <div class="form-group">
                    <label>
                        Price <span class="required">*</span>
                    </label>

                    <input
                        type="number"
                        name="price"
                        placeholder="Enter service price"
                        min="0"
                        step="0.01"
                        required
                    >
                </div>

                <div class="buttons">

                    <button
                        type="submit"
                        class="btn btn-primary">
                        Create Service
                    </button>

                    <a
                        href="{% url 'service_list' %}"
                        class="btn btn-secondary">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
