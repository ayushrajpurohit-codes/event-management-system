<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Event Type - Event Management System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f3f4f6;
            color: #111827;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 240px;
            background: #111827;
            color: white;
            padding: 25px 15px;
        }

        .sidebar h2 {
            font-size: 21px;
            text-align: center;
            margin-bottom: 35px;
        }

        .sidebar a {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #d1d5db;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 7px;
            margin-bottom: 6px;
            font-size: 13px;
        }

        .sidebar a:hover {
            background: #1f2937;
            color: white;
        }

        .sidebar-icon {
            width: 20px;
            text-align: center;
            font-size: 15px;
        }

        /* Main */
        .main {
            flex: 1;
        }

        .topbar {
            height: 70px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            border-bottom: 1px solid #e5e7eb;
        }

        .topbar h3 {
            font-size: 18px;
        }

        .content {
            padding: 30px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .page-header h1 {
            font-size: 26px;
        }

        .back-btn {
            text-decoration: none;
            background: #6b7280;
            color: white;
            padding: 10px 16px;
            border-radius: 7px;
            font-size: 13px;
        }

        .back-btn:hover {
            background: #4b5563;
        }

        /* Form Card */
        .form-card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            max-width: 700px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #2563eb;
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .save-btn {
            border: none;
            background: #2563eb;
            color: white;
            padding: 11px 20px;
            border-radius: 7px;
            font-size: 14px;
            cursor: pointer;
        }

        .save-btn:hover {
            background: #1d4ed8;
        }

        .cancel-btn {
            text-decoration: none;
            background: #e5e7eb;
            color: #111827;
            padding: 11px 20px;
            border-radius: 7px;
            font-size: 14px;
        }

        .cancel-btn:hover {
            background: #d1d5db;
        }
    </style>
</head>

<body>

<div class="layout">

    <!-- Sidebar -->
    <div class="sidebar">

        <h2>Event Management</h2>

        <a href="{% url 'dashboard' %}">
            <span class="sidebar-icon">🏠</span>
            Dashboard
        </a>

        <a href="{% url 'booking_list' %}">
            <span class="sidebar-icon">📋</span>
            Bookings
        </a>

        <a href="{% url 'event_list' %}">
            <span class="sidebar-icon">📅</span>
            Events
        </a>

        <a href="{% url 'event_type_list' %}">
            <span class="sidebar-icon">🎪</span>
            Event Types
        </a>

        <a href="{% url 'service_list' %}">
            <span class="sidebar-icon">🛠️</span>
            Services
        </a>

        <a href="#">
            <span class="sidebar-icon">📊</span>
            Reports
        </a>

        <a href="#">
            <span class="sidebar-icon">👥</span>
            Users
        </a>

        <a href="#">
            <span class="sidebar-icon">⚙️</span>
            Settings
        </a>

        <a href="{% url 'logout' %}">
            <span class="sidebar-icon">🚪</span>
            Logout
        </a>

    </div>

    <!-- Main -->
    <div class="main">

        <div class="topbar">
            <h3>Edit Event Type</h3>

            <span>
                Welcome, {{ request.user.username }}
            </span>
        </div>

        <div class="content">

            <div class="page-header">
                <h1>Edit Event Type</h1>

                <a href="{% url 'event_type_list' %}" class="back-btn">
                    ← Back
                </a>
            </div>

            <div class="form-card">

                <form method="POST">

                    {% csrf_token %}

                    <div class="form-group">
                        <label for="name">
                            Event Type Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            value="{{ event_type.name }}"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="description">
                            Description
                        </label>

                        <textarea
                            id="description"
                            name="description"
                            placeholder="Enter event type description..."
                        >{{ event_type.description }}</textarea>
                    </div>

                    <div class="form-actions">

                        <button type="submit" class="save-btn">
                            Update Event Type
                        </button>

                        <a
                            href="{% url 'event_type_list' %}"
                            class="cancel-btn"
                        >
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
