<!DOCTYPE html>
<html>
<head>
    <title>Edit Booking - Event Management System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #1f2937;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 240px;
            height: 100vh;
            background: #111827;
            color: white;
            padding: 25px 15px;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 22px;
        }

        .sidebar a {
            display: block;
            color: #d1d5db;
            text-decoration: none;
            padding: 13px 15px;
            margin-bottom: 6px;
            border-radius: 8px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: #2563eb;
            color: white;
        }

        .main {
            margin-left: 240px;
            min-height: 100vh;
        }

        .topbar {
            height: 70px;
            background: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            border-bottom: 1px solid #e5e7eb;
        }

        .topbar h3 {
            font-size: 21px;
        }

        .welcome {
            color: #6b7280;
        }

        .content {
            padding: 30px;
        }

        .page-header {
            margin-bottom: 25px;
        }

        .page-header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .page-header p {
            color: #6b7280;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            max-width: 950px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #374151;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
            background: white;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #2563eb;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .required {
            color: #dc2626;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        .btn {
            border: none;
            padding: 12px 22px;
            border-radius: 7px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #374151;
        }

        .btn-secondary:hover {
            background: #d1d5db;
        }

        @media (max-width: 800px) {
            .sidebar {
                width: 200px;
            }

            .main {
                margin-left: 200px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="sidebar">

    <h2>Event Manager</h2>

    <a href="{% url 'dashboard' %}">Dashboard</a>
    <a href="{% url 'booking_list' %}" class="active">Bookings</a>
    <a href="{% url 'event_list' %}">Events</a>
    <a href="{% url 'event_type_list' %}">Event Types</a>
    <a href="{% url 'service_list' %}">Services</a>

    <a href="#">Reports</a>
    <a href="#">Users</a>
    <a href="#">Settings</a>

    <a href="{% url 'logout' %}">Logout</a>

</div>

<div class="main">

    <div class="topbar">

        <h3>Edit Booking</h3>

        <div class="welcome">
            Welcome, {{ request.user.username }}
        </div>

    </div>

    <div class="content">

        <div class="page-header">
            <h1>Edit Booking</h1>
            <p>Update the booking information below.</p>
        </div>

        <div class="card">

            <form method="POST">

                {% csrf_token %}

                <div class="form-row">

                    <div class="form-group">
                        <label>
                            Customer Name <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            name="customer_name"
                            value="{{ booking.customer_name }}"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>
                            Customer Email <span class="required">*</span>
                        </label>

                        <input
                            type="email"
                            name="customer_email"
                            value="{{ booking.customer_email }}"
                            required
                        >
                    </div>

                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label>
                            Customer Phone <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            name="customer_phone"
                            value="{{ booking.customer_phone }}"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>
                            Number of Guests <span class="required">*</span>
                        </label>

                        <input
                            type="number"
                            name="guests"
                            value="{{ booking.guests }}"
                            min="1"
                            required
                        >
                    </div>

                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label>
                            Event <span class="required">*</span>
                        </label>

                        <select name="event" required>

                            {% for event in events %}

                                <option
                                    value="{{ event.id }}"
                                    {% if event.id == booking.event.id %}selected{% endif %}
                                >
                                    {{ event.name }}
                                </option>

                            {% endfor %}

                        </select>
                    </div>

                    <div class="form-group">
                        <label>Service</label>

                        <select name="service">

                            <option value="">-- No Service --</option>

                            {% for service in services %}

                                <option
                                    value="{{ service.id }}"
                                    {% if booking.service and service.id == booking.service.id %}selected{% endif %}
                                >
                                    {{ service.name }} - ₹{{ service.price }}
                                </option>

                            {% endfor %}

                        </select>
                    </div>

                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label>
                            Booking Date <span class="required">*</span>
                        </label>

                        <input
                            type="date"
                            name="booking_date"
                            value="{{ booking.booking_date|date:'Y-m-d' }}"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>
                            Amount <span class="required">*</span>
                        </label>

                        <input
                            type="number"
                            name="amount"
                            value="{{ booking.amount }}"
                            min="0"
                            step="0.01"
                            required
                        >
                    </div>

                </div>

                <div class="form-group">

                    <label>
                        Venue <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        name="venue"
                        value="{{ booking.venue }}"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>Notes</label>

                    <textarea
                        name="notes"
                    >{{ booking.notes|default:"" }}</textarea>

                </div>

                <div class="buttons">

                    <button
                        type="submit"
                        class="btn btn-primary">
                        Update Booking
                    </button>

                    <a
                        href="{% url 'booking_list' %}"
                        class="btn btn-secondary">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
