<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>New Booking - Event Management System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f6fa;
            color: #333;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 250px;
            height: 100vh;
            background: #1f2937;
            color: white;
            padding: 25px 15px;
        }

        .logo {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            padding-bottom: 30px;
            border-bottom: 1px solid #374151;
        }

        .menu {
            margin-top: 25px;
        }

        .menu a {
            display: block;
            color: #d1d5db;
            text-decoration: none;
            padding: 13px 15px;
            margin-bottom: 6px;
            border-radius: 6px;
        }

        .menu a:hover,
        .menu a.active {
            background: #374151;
            color: white;
        }

        .main {
            margin-left: 250px;
            min-height: 100vh;
        }

        .topbar {
            height: 70px;
            background: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            box-shadow: 0 1px 5px rgba(0,0,0,.08);
        }

        .content {
            padding: 30px;
        }

        .page-header {
            margin-bottom: 25px;
        }

        .page-header h1 {
            font-size: 26px;
            margin-bottom: 8px;
        }

        .page-header p {
            color: #777;
        }

        .form-container {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,.06);
            max-width: 1000px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #3b82f6;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        .btn {
            padding: 11px 20px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }

        .btn-primary {
            background: #3b82f6;
            color: white;
        }

        .btn-primary:hover {
            background: #2563eb;
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d1d5db;
        }

        @media (max-width: 800px) {
            .sidebar {
                width: 200px;
            }

            .main {
                margin-left: 200px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <aside class="sidebar">

        <div class="logo">
            Event Management
        </div>

        <div class="menu">

            <a href="/dashboard/">🏠 Dashboard</a>

            <a href="/bookings/" class="active">
                📋 Bookings
            </a>

            <a href="#">📅 Events</a>

            <a href="#">🎪 Event Types</a>

            <a href="#">🛠️ Services</a>

            <a href="#">📊 Reports</a>

            <a href="#">👥 Users</a>

            <a href="#">⚙️ Settings</a>

            <a href="{% url 'logout' %}">
                🚪 Logout
            </a>

        </div>

    </aside>


    <main class="main">

        <header class="topbar">

            <h2>New Booking</h2>

            <div>
                Welcome, {{ request.user.username }}
            </div>

        </header>


        <section class="content">

            <div class="page-header">

                <h1>Create New Booking</h1>

                <p>
                    Enter customer and event booking details.
                </p>

            </div>


            <div class="form-container">

                <form method="POST">

                    {% csrf_token %}


                    <div class="form-row">

                        <div class="form-group">

                            <label>
                                Customer Name *
                            </label>

                            <input
                                type="text"
                                name="customer_name"
                                placeholder="Enter customer name"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label>
                                Customer Email *
                            </label>

                            <input
                                type="email"
                                name="customer_email"
                                placeholder="Enter email address"
                                required
                            >

                        </div>

                    </div>


                    <div class="form-row">

                        <div class="form-group">

                            <label>
                                Customer Phone *
                            </label>

                            <input
                                type="text"
                                name="customer_phone"
                                placeholder="Enter phone number"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label>
                                Event *
                            </label>

                            <select name="event" required>

                                <option value="">
                                    Select Event
                                </option>

                                {% for event in events %}

                                    <option value="{{ event.id }}">
                                        {{ event.name }}
                                    </option>

                                {% endfor %}

                            </select>

                        </div>

                    </div>


                    <div class="form-row">

                        <div class="form-group">

                            <label>
                                Service
                            </label>

                            <select name="service">

                                <option value="">
                                    Select Service
                                </option>

                                {% for service in services %}

                                    <option value="{{ service.id }}">
                                        {{ service.name }} - ₹{{ service.price }}
                                    </option>

                                {% endfor %}

                            </select>

                        </div>


                        <div class="form-group">

                            <label>
                                Booking Date *
                            </label>

                            <input
                                type="date"
                                name="booking_date"
                                required
                            >

                        </div>

                    </div>


                    <div class="form-row">

                        <div class="form-group">

                            <label>
                                Number of Guests *
                            </label>

                            <input
                                type="number"
                                name="guests"
                                min="1"
                                value="1"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label>
                                Amount (₹) *
                            </label>

                            <input
                                type="number"
                                name="amount"
                                min="0"
                                step="0.01"
                                placeholder="Enter amount"
                                required
                            >

                        </div>

                    </div>


                    <div class="form-row">

                        <div class="form-group full">

                            <label>
                                Venue *
                            </label>

                            <input
                                type="text"
                                name="venue"
                                placeholder="Enter event venue"
                                required
                            >

                        </div>

                    </div>


                    <div class="form-row">

                        <div class="form-group full">

                            <label>
                                Notes
                            </label>

                            <textarea
                                name="notes"
                                placeholder="Enter any additional notes..."
                            ></textarea>

                        </div>

                    </div>


                    <div class="buttons">

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Create Booking
                        </button>


                        <a
                            href="{% url 'booking_list' %}"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </section>

    </main>

</body>
</html>
